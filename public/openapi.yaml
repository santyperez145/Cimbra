        status: { type: string, enum: [active, paused, cancelled, expired] }
        nextChargeAt: { type: string, format: date-time }
        lastExecutedAt: { type: [string, 'null'], format: date-time }
        retryCount: { type: integer, minimum: 0 }
        maxRetries: { type: integer, minimum: 0, maximum: 10 }
        cancelledAt: { type: [string, 'null'], format: date-time }
        createdBy: { type: string, format: uuid }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateRecurringPaymentMandateInput:
      type: object
      additionalProperties: false
      required: [accountId, billerId, subscriberReference, frequency, amountLimit, consentReference, consentedAt, nextChargeAt]
      properties:
        accountId: { type: string, format: uuid }
        billerId: { type: string, format: uuid }
        subscriberReference: { type: string, minLength: 4, maxLength: 120 }
        frequency: { type: string, enum: [weekly, monthly] }
        amount:
          type: string
          pattern: '^\d+(?:\.\d+)?$'
          description: Required for mobile_topup and gift_card; omitted for debt-based bill_payment mandates.
        amountLimit: { type: string, pattern: '^\d+(?:\.\d+)?$' }
        consentReference: { type: string, minLength: 3, maxLength: 120 }
        consentedAt: { type: string, format: date-time }
        nextChargeAt: { type: string, format: date-time }
        maxRetries: { type: integer, minimum: 0, maximum: 10, default: 3 }
    Dispute:
      type: object
      required: [id, transactionId, reason, description, amountMinor, amount, currency, status, open, priority, provisionalCreditRequested, creditStatus, possibleEvents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        reason: { type: string, enum: [card_not_present, duplicate, amount_mismatch, service_not_received, credit_not_processed, cash_not_received, other] }
        description: { type: string }
        amountMinor: { type: string }
        amount: { type: number }
        currency: { type: string, enum: [ARS, USD, MXN, COP, BRL, CLP, PEN] }
        status: { type: string, enum: [opened, under_review, network_ready, won, lost, rejected, cancelled] }
        open: { type: boolean }
        priority: { type: string, enum: [low, medium, high, critical] }
        provisionalCreditRequested: { type: boolean }
        creditStatus: { type: string, enum: [none, posted, final, reversed] }
        creditTransactionId: { type: [string, 'null'], format: uuid }
        creditReversalTransactionId: { type: [string, 'null'], format: uuid }
        possibleEvents: { type: array, items: { type: string, enum: [start_review, mark_network_ready, resolve_won, resolve_lost, reject, cancel] } }
        dueAt: { type: [string, 'null'], format: date-time }
        resolutionNote: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        originalTransaction: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DisputeTimelineEvent:
      type: object
      required: [id, event, fromStatus, toStatus, note, actorId, actorName, createdAt]
      properties:
        id: { type: string, format: uuid }
        event: { type: string, enum: [created, start_review, mark_network_ready, resolve_won, resolve_lost, reject, cancel] }
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: string }
        note: { type: string }
        actorId: { type: string, format: uuid }
        actorName: { type: string }
        createdAt: { type: string, format: date-time }
    Card:
      type: object
      required: [id, programId, programName, accountId, customerId, product, format, last4, status, statusReason, activatedAt, terminatedAt, createdAt, updatedAt]
      additionalProperties: false
      description: Sandbox card representation. It never contains PAN, CVV, track data or a network token.
      properties:
        id: { type: string, format: uuid }
        programId: { type: [string, 'null'], format: uuid }
        programName: { type: [string, 'null'] }
        accountId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        product: { type: string, enum: [debit, credit, prepaid] }
        format: { type: string, enum: [virtual, physical] }
        last4: { type: string, pattern: '^\d{4}$' }
        status: { type: string, enum: [created, active, frozen, terminated] }
        statusReason: { type: [string, 'null'] }
        activatedAt: { type: [string, 'null'], format: date-time }
        terminatedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CardProgram:
      type: object
      required: [id, name, product, formats, defaultCurrency, status, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        product: { type: string, enum: [debit, credit, prepaid] }
        formats: { type: array, items: { type: string, enum: [virtual, physical] } }
        defaultCurrency: { type: string, enum: [ARS, USD, MXN, COP, BRL, CLP, PEN] }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
    CardLifecycleEvent:
      type: object
      required: [id, cardId, fromStatus, toStatus, reason, actorId, actorName, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        fromStatus: { type: [string, 'null'], enum: [created, active, frozen, terminated, null] }
        toStatus: { type: string, enum: [created, active, frozen, terminated] }
        reason: { type: string }
        actorId: { type: string, format: uuid }
        actorName: { type: string }
        createdAt: { type: string, format: date-time }
    CardControls:
      type: object
      required: [id, cardId, version, currency, perTransactionLimitMinor, perTransactionLimit, dailyLimitMinor, dailyLimit, monthlyLimitMinor, monthlyLimit, allowedChannels, allowedMccs, blockedMccs, status, createdBy, createdByName, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        currency: { type: string, enum: [ARS, USD, MXN, COP, BRL, CLP, PEN] }
        perTransactionLimitMinor: { type: [string, 'null'] }
        perTransactionLimit: { type: [string, 'null'] }
        dailyLimitMinor: { type: [string, 'null'] }
        dailyLimit: { type: [string, 'null'] }
        monthlyLimitMinor: { type: [string, 'null'] }
        monthlyLimit: { type: [string, 'null'] }
        allowedChannels: { type: array, items: { type: string, enum: [ecommerce, contactless, chip, magstripe, atm] } }
        allowedMccs: { type: array, items: { type: string, pattern: '^\d{4}$' } }
        blockedMccs: { type: array, items: { type: string, pattern: '^\d{4}$' } }
        status: { type: string, enum: [active, inactive] }
        createdBy: { type: string, format: uuid }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
    OperationalWorkItem:
      type: object
      required: [id, type, status, open, priority, assignee, dueAt, escalatedAt, slaStatus, reference, summary, amountMinor, amount, currency, noteCount, evidenceCount, metadata, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [risk_case, reconciliation_exception, dispute] }
        status: { type: string, enum: [open, resolved, accepted, opened, under_review, network_ready, won, lost, rejected, cancelled] }
        open: { type: boolean }
        priority: { type: string, enum: [low, medium, high, critical] }
        assignee: { type: [object, 'null'], additionalProperties: true }
        dueAt: { type: [string, 'null'], format: date-time }
        escalatedAt: { type: [string, 'null'], format: date-time }
        slaStatus: { type: string, enum: [none, overdue, due_soon, on_track] }
        reference: { type: string }
        summary: { type: string }
        amountMinor: { type: string }
        amount: { type: number }
        currency: { type: string }
        noteCount: { type: integer, minimum: 0 }
        evidenceCount: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApprovalRequest:
      type: object
      required: [id, actionType, resourceType, resourceId, status, requestPayload, requestedBy, requestedByName, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        actionType: { type: string, enum: [settlement.execute, transfer.create, payout_batch.execute, risk.case.resolve, reconciliation.exception.resolve, dispute.resolve] }
        resourceType: { type: string, enum: [settlement_cycle, transfer, payout_batch, risk_case, reconciliation_exception, dispute] }
        resourceId: { type: string, format: uuid }
        status: { type: string, enum: [pending, executed, rejected, cancelled, expired, failed] }
        requestPayload: { type: object, additionalProperties: true }
        requestedBy: { type: string, format: uuid }
        requestedByName: { type: string }
        resolvedBy: { type: [string, 'null'], format: uuid }
        resolvedByName: { type: [string, 'null'] }
        resolutionReason: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        executedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrganizationMember:
      type: object
      required: [id, userId, email, displayName, role, emailVerified, mfaEnabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, operator, viewer] }
        emailVerified: { type: boolean }
        mfaEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    OrganizationInvitation:
      type: object
      required: [id, email, role, status, invitedBy, invitedByName, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, operator, viewer] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invitedBy: { type: string, format: uuid }
        invitedByName: { type: string }
        acceptedBy: { type: [string, 'null'], format: uuid }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RiskEvaluation:
      type: object
      required: [id, operationType, resourceType, resourceId, amountMinor, amount, currency, counterparty, score, decision, matchedRuleIds, matchedListEntryIds, reasons, signals, decisionLatencyMs, outcome, createdAt, requestFingerprint, replayed]
      properties:
        id: { type: string, format: uuid }
        operationType: { type: string, enum: [transfer, cash_in, cash_out] }
        resourceType: { type: string }
        resourceId: { type: [string, 'null'] }
        amountMinor: { type: string }
        amount: { type: number }
        currency: { type: string }
        counterparty: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        decision: { type: string, enum: [approve, review, decline] }
        matchedRuleIds: { type: array, items: { type: string } }
        matchedListEntryIds: { type: array, items: { type: string, format: uuid } }
        reasons: { type: array, items: { type: string } }
        signals: { $ref: '#/components/schemas/RiskSignals' }
        decisionLatencyMs: { type: [integer, 'null'], minimum: 0, description: Persisted server-side decision latency for measured SLOs. }
        outcome:
          oneOf:
            - { $ref: '#/components/schemas/RiskOutcome' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        requestFingerprint: { type: string }
        replayed: { type: boolean }
    RiskStepUpChallenge:
      type: object
      additionalProperties: false
      required: [id, evaluationId, method, delivery, status, attemptCount, remainingAttempts, maxAttempts, expiresAt, verifiedAt, failedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        evaluationId: { type: string, format: uuid }
        method: { type: string, const: otp }
        delivery: { type: string, const: client_managed }
        status: { type: string, enum: [pending, verified, failed, expired, cancelled] }
        attemptCount: { type: integer, minimum: 0 }
        remainingAttempts: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        expiresAt: { type: string, format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RiskStepUpAttempt:
      type: object
      additionalProperties: false
      required: [id, attemptNumber, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        attemptNumber: { type: integer, minimum: 1 }
        result: { type: string, enum: [matched, mismatch, expired, locked] }
        createdAt: { type: string, format: date-time }
    RiskSignalsInput:
      type: object
      additionalProperties: false
      properties:
        deviceReference: { type: string, minLength: 2, maxLength: 160, writeOnly: true }
        identityReference: { type: string, minLength: 2, maxLength: 160, writeOnly: true }
        deviceTrust: { type: string, enum: [trusted, unknown, suspicious] }
        identityVerified: { type: boolean }
        ipCountry: { type: string, pattern: '^[A-Za-z]{2}$' }
        countryMismatch: { type: boolean }
    RiskSignals:
      type: object
      required: [deviceReferencePresent, identityReferencePresent]
      properties:
        deviceReferencePresent: { type: boolean }
        identityReferencePresent: { type: boolean }
        deviceTrust: { type: string, enum: [trusted, unknown, suspicious] }
        identityVerified: { type: boolean }
        ipCountry: { type: string, pattern: '^[A-Z]{2}$' }
        countryMismatch: { type: boolean }
    RiskOutcome:
      type: object
      required: [id, label, fraudType, lossAmountMinor, currency, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, enum: [legitimate, fraud] }
        fraudType: { type: [string, 'null'], enum: [account_takeover, identity_fraud, scam, stolen_instrument, merchant_fraud, other, null] }
        lossAmountMinor: { type: string }
        currency: { type: string, enum: [ARS, USD, MXN, COP, BRL, CLP, PEN] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    RiskListEntry:
      type: object
      required: [id, subjectType, subjectPreview, category, reason, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [counterparty, device, identity] }
        subjectPreview: { type: string, description: Masked non-secret recognition hint; never the original subject. }
        category: { type: string, enum: [allow, watch, block] }
        reason: { type: string }
        status: { type: string, enum: [active, disabled] }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ReconciliationRun:
      type: object
      required: [id, name, source, currency, ingestionMode, fileName, fileSha256, periodStart, periodEnd, status, expectedMinor, actualMinor, differenceMinor, matchedCount, exceptionCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string, enum: [bank, clearing, card_network, cash_network, internal] }
        currency: { type: string }
        ingestionMode: { type: string, enum: [api, csv] }
        fileName: { type: [string, 'null'] }
        fileSha256: { type: [string, 'null'] }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        status: { type: string, enum: [open, completed] }
        expectedMinor: { type: string }
        actualMinor: { type: string }
        differenceMinor: { type: string }
        matchedCount: { type: integer }
        exceptionCount: { type: integer }
    SettlementCycle:
      type: object
      required: [id, reconciliationRunId, name, rail, currency, periodStart, periodEnd, netMinor, differenceMinor, status, scheduledFor, settledAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reconciliationRunId: { type: string, format: uuid }
        name: { type: string }
        rail: { type: string, enum: [bank, clearing, card_network, cash_network, internal] }
        currency: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        netMinor: { type: string }
        differenceMinor: { type: string }
        status: { type: string, enum: [ready, scheduled, settled] }
        scheduledFor: { type: [string, 'null'], format: date-time }
        settledAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlatformCapability:
      type: object
      required: [id, name, domain, summary, features, interfaces, availability, delivery, regulatoryBoundary]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string, enum: [core, payments, cards, commerce, credit, risk, operations, platform] }
        summary: { type: string }
        features: { type: array, items: { type: string } }
        interfaces:
          type: array
          items: { type: string, enum: [rest_api, webhooks, sdk, console, iso8583, files, streaming] }
        availability: { type: string, enum: [sandbox, foundation, roadmap] }
        delivery: { type: string, const: cimbra_native }
        regulatoryBoundary: { type: string }
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-cimbra_session
      description: First-party opaque session token. Only its SHA-256 hash is stored server-side.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Cimbra API key
      description: S2S key with a cim_sk_test_ prefix. The plaintext secret is shown once and only its SHA-256 hash is stored.
