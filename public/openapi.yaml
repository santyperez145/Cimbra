        id: { type: string, format: uuid }
        externalReference: { type: string }
        name: { type: string }
        entityType: { type: string, enum: [individual, business] }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        currency: { type: string, enum: [ARS, USD, MXN, COP, BRL, CLP, PEN] }
        destinationType: { type: string, enum: [local_account, alias, iban, clabe, pix_key] }
