    PayoutItem:
      type: object
      additionalProperties: false
      required: [id, batchId, beneficiaryId, beneficiaryName, beneficiaryReference, destinationType, destinationLast4, externalReference, amountMinor, amount, currency, description, status, transactionId, failureCode, failureMessage, attemptCount, processedAt, createdAt, updatedAt]
      properties:
