        score: { type: integer, minimum: 0, maximum: 100 }
        decision: { type: string, enum: [approve, review, decline] }
        matchedRuleIds: { type: array, items: { type: string } }
        matchedListEntryIds: { type: array, items: { type: string, format: uuid } }
        reasons: { type: array, items: { type: string } }
        signals: { $ref: '#/components/schemas/RiskSignals' }
        decisionLatencyMs: { type: [integer, 'null'], minimum: 0, description: Persisted server-side decision latency for measured SLOs. }
        outcome:
          oneOf:
            - { $ref: '#/components/schemas/RiskOutcome' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        requestFingerprint: { type: string }
        replayed: { type: boolean }
    RiskStepUpChallenge:
      type: object
      additionalProperties: false
      required: [id, evaluationId, method, delivery, status, attemptCount, remainingAttempts, maxAttempts, expiresAt, verifiedAt, failedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        evaluationId: { type: string, format: uuid }
        method: { type: string, const: otp }
        delivery: { type: string, const: client_managed }
        status: { type: string, enum: [pending, verified, failed, expired, cancelled] }
        attemptCount: { type: integer, minimum: 0 }
        remainingAttempts: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        expiresAt: { type: string, format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RiskStepUpAttempt:
      type: object
      additionalProperties: false
      required: [id, attemptNumber, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        attemptNumber: { type: integer, minimum: 1 }
        result: { type: string, enum: [matched, mismatch, expired, locked] }
        createdAt: { type: string, format: date-time }
    RiskSignalsInput:
      type: object
      additionalProperties: false
      properties:
        deviceReference: { type: string, minLength: 2, maxLength: 160, writeOnly: true }
        identityReference: { type: string, minLength: 2, maxLength: 160, writeOnly: true }
        deviceTrust: { type: string, enum: [trusted, unknown, suspicious] }
        identityVerified: { type: boolean }
        ipCountry: { type: string, pattern: '^[A-Za-z]{2}$' }
        countryMismatch: { type: boolean }
    RiskSignals:
      type: object
      required: [deviceReferencePresent, identityReferencePresent]
      properties:
        deviceReferencePresent: { type: boolean }
        identityReferencePresent: { type: boolean }
        deviceTrust: { type: string, enum: [trusted, unknown, suspicious] }
        identityVerified: { type: boolean }
        ipCountry: { type: string, pattern: '^[A-Z]{2}$' }
        countryMismatch: { type: boolean }
    RiskOutcome:
      type: object
      required: [id, label, fraudType, lossAmountMinor, currency, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, enum: [legitimate, fraud] }
        fraudType: { type: [string, 'null'], enum: [account_takeover, identity_fraud, scam, stolen_instrument, merchant_fraud, other, null] }
        lossAmountMinor: { type: string }
        currency: { type: string, enum: [ARS, USD, MXN, COP, BRL, CLP, PEN] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    RiskListEntry:
      type: object
      required: [id, subjectType, subjectPreview, category, reason, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [counterparty, device, identity] }
        subjectPreview: { type: string, description: Masked non-secret recognition hint; never the original subject. }
        category: { type: string, enum: [allow, watch, block] }
        reason: { type: string }
        status: { type: string, enum: [active, disabled] }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ReconciliationRun:
      type: object
      required: [id, name, source, currency, ingestionMode, fileName, fileSha256, periodStart, periodEnd, status, expectedMinor, actualMinor, differenceMinor, matchedCount, exceptionCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string, enum: [bank, clearing, card_network, cash_network, internal] }
        currency: { type: string }
        ingestionMode: { type: string, enum: [api, csv] }
        fileName: { type: [string, 'null'] }
        fileSha256: { type: [string, 'null'] }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        status: { type: string, enum: [open, completed] }
        expectedMinor: { type: string }
        actualMinor: { type: string }
        differenceMinor: { type: string }
        matchedCount: { type: integer }
        exceptionCount: { type: integer }
    SettlementCycle:
      type: object
      required: [id, reconciliationRunId, name, rail, currency, periodStart, periodEnd, netMinor, differenceMinor, status, scheduledFor, settledAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reconciliationRunId: { type: string, format: uuid }
        name: { type: string }
        rail: { type: string, enum: [bank, clearing, card_network, cash_network, internal] }
        currency: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        netMinor: { type: string }
        differenceMinor: { type: string }
        status: { type: string, enum: [ready, scheduled, settled] }
        scheduledFor: { type: [string, 'null'], format: date-time }
        settledAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlatformCapability:
      type: object
      required: [id, name, domain, summary, features, interfaces, availability, delivery, regulatoryBoundary]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string, enum: [core, payments, cards, commerce, credit, risk, operations, platform] }
        summary: { type: string }
        features: { type: array, items: { type: string } }
        interfaces:
          type: array
          items: { type: string, enum: [rest_api, webhooks, sdk, console, iso8583, files, streaming] }
        availability: { type: string, enum: [live, sandbox, foundation, roadmap] }
        delivery: { type: string, const: cimbra_native }
        regulatoryBoundary: { type: string }
    LiveReadiness:
      type: object
      required: [requestedMode, effectiveMode, liveReady, liveBlocked, blockReason, goLive, environments, products, rails, fintechPath, capitalPlan, references, summary]
      properties:
        requestedMode: { type: string, enum: [sandbox, live] }
        effectiveMode: { type: string, enum: [sandbox, live] }
        liveReady: { type: boolean }
        liveBlocked: { type: boolean }
        blockReason: { type: ['string', 'null'] }
        goLive:
          type: object
          required: [benchmark, documentationUrl, current, stages]
          properties:
            benchmark: { type: string, const: Pomelo }
            documentationUrl: { type: string, format: uri }
            current: { type: string, enum: [integracion, homologacion, go_live] }
            stages:
              type: array
              items:
                type: object
                required: [id, name, summary]
                properties:
                  id: { type: string, enum: [integracion, homologacion, go_live] }
                  name: { type: string }
                  summary: { type: string }
        environments:
          type: array
          items:
            type: object
            required: [id, status, hostname, pciHostname, credentialsPrefix, benchmark]
            properties:
              id: { type: string, enum: [sandbox, production] }
              status: { type: string, enum: [active, provisioned, not_provisioned] }
              hostname: { type: ['string', 'null'] }
              pciHostname: { type: ['string', 'null'] }
              credentialsPrefix: { type: string }
              benchmark: { type: string }
        products:
          type: array
          items:
            type: object
            required: [id, name, country, benchmark, documentationUrl, network, sandboxCoverage, missingForProduction, status, requiredRailIds, missingOfficialRails, adapterReady]
            properties:
              id: { type: string }
              name: { type: string }
              country: { type: string, enum: [AR, LATAM] }
              benchmark: { type: string }
              documentationUrl: { type: string, format: uri }
              network: { type: string }
              sandboxCoverage: { type: string }
              missingForProduction: { type: string }
              status: { type: string, enum: [integracion, homologacion, go_live] }
              requiredRailIds: { type: array, items: { type: string } }
              missingOfficialRails: { type: array, items: { type: string } }
              adapterReady: { type: boolean }
        rails:
          type: array
          items:
            type: object
            required: [id, name, country, kind, counterpartyKind, counterparty, officialUrl, summary, wiringContract, productIds, status, adapterRegistered]
            properties:
              id: { type: string }
              name: { type: string }
              country: { type: string, enum: [AR, LATAM] }
              kind: { type: string, enum: [corporate, regulatory_registry, safeguarding, directory, instant_credit, instant_debit, echeq_clearing, cvu_assignment, qr_pct, card_issuing, bill_payments] }
              counterpartyKind: { type: string, enum: [clearing_house, bank, card_scheme, official_registry, regulated_sponsor, corporate] }
              counterparty: { type: string }
              officialUrl: { type: string, format: uri }
              summary: { type: string }
              wiringContract: { type: string }
              productIds: { type: array, items: { type: string } }
              status: { type: string, enum: [unwired, negotiating, contracted, certified, live] }
              adapterRegistered: { type: boolean }
        fintechPath:
          type: object
          required: [jurisdiction, intendedFigure, summary, officialSources, gates, metCount, gateCount]
          properties:
            jurisdiction: { type: string, const: AR }
            intendedFigure: { type: string, const: PSPCP }
            summary: { type: string }
            officialSources:
              type: array
              items:
                type: object
                required: [name, url, surface]
                properties:
                  name: { type: string }
                  url: { type: string, format: uri }
                  surface: { type: string }
            gates:
              type: array
              items:
                type: object
                required: [id, connectionId, name, summary, status, met]
                properties:
                  id: { type: string }
                  connectionId: { type: ['string', 'null'] }
                  name: { type: string }
                  summary: { type: string }
                  status: { type: string, enum: [unwired, negotiating, contracted, certified, live] }
                  met: { type: boolean }
            metCount: { type: integer }
            gateCount: { type: integer }
        capitalPlan:
          type: object
          required: [currency, envelope, allocated, remaining, spent, commercialGate, liveReadyAfterSpend, summary, officialSources, allocations, forbidden, seedUses, raise]
          properties:
            currency: { type: string, const: USD }
            envelope: { type: integer, const: 500 }
            allocated: { type: integer }
            remaining: { type: integer }
            spent: { type: integer, const: 0 }
            commercialGate: { type: string, const: gate_1_design_partners }
            liveReadyAfterSpend: { type: boolean, const: false }
            summary: { type: string }
            officialSources:
              type: array
              items:
                type: object
                required: [name, url, surface]
                properties:
                  name: { type: string }
                  url: { type: string, format: uri }
                  surface: { type: string }
            allocations:
              type: array
              items:
                type: object
                required: [id, amount, status, name, summary]
                properties:
                  id: { type: string }
                  amount: { type: integer }
                  status: { type: string, enum: [authorized_unspent, spent, exhausted] }
                  name: { type: string }
                  summary: { type: string }
            forbidden:
              type: array
              items:
                type: object
                required: [id, name, summary]
                properties:
                  id: { type: string }
                  name: { type: string }
                  summary: { type: string }
            seedUses: { type: array, items: { type: string } }
            raise:
              type: object
              required: [instrument, amountUsd, thesis]
              properties:
                instrument: { type: string, const: pre_seed }
                amountUsd: { type: ['integer', 'null'] }
                thesis: { type: string }
        references:
          type: array
          items:
            type: object
            required: [benchmark, url, surface]
            properties:
              benchmark: { type: string }
              url: { type: string, format: uri }
              surface: { type: string }
        summary:
          type: object
          required: [integracion, homologacion, goLive, officialRailsLive, officialRailsTotal]
          properties:
            integracion: { type: integer }
            homologacion: { type: integer }
            goLive: { type: integer }
            officialRailsLive: { type: integer }
            officialRailsTotal: { type: integer }
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-cimbra_session
      description: First-party opaque session token. Only its SHA-256 hash is stored server-side.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Cimbra API key
      description: S2S key. Sandbox secrets use cim_sk_test_. Live secrets cim_sk_live_ are reserved until a production hostname is provisioned and a product reaches Go Live. The plaintext secret is shown once and only its SHA-256 hash is stored.
